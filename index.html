<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>अविनाश अतुल्य | गणेश उत्सव 2026</title>
<style>
body{font-family:Arial,sans-serif;background:#FFF8EC;margin:0;color:#333}
header{background:linear-gradient(135deg,#E65100,#F59E0B,#FDE68A);padding:22px;text-align:center;color:#fff}
.logo{display:inline-block;background:#fff;padding:10px 18px;border-radius:14px}
.logo .s{color:#2563EB;font-size:13px;font-weight:bold}.logo .b{color:#65A30D;font-size:34px;font-weight:bold}
.wrap{max-width:980px;margin:auto;padding:18px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:16px}
table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#F59E0B;color:#fff}.blk{display:flex;gap:6px;justify-content:center}.blk input{width:55px;padding:6px;text-align:center}
button{background:#F59E0B;color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer}
.hidden{display:none}input[type=password]{padding:8px;width:220px}
</style></head>
<body>
<header><div class="logo"><div class="s">अविनाश</div><div class="b">अतुल्य</div></div>
<h2>🪔 श्री गणेश चतुर्थी उत्सव 2026</h2><div>10 दिवसीय आरती एवं प्रसाद अर्पण कार्यक्रम</div></header>
<div class="wrap">
<div class="card"><h3>🔐 Admin Login</h3>
<input type=password id=p placeholder="Admin Password"><button onclick=login()>Login</button>
<span id=st style="margin-left:10px;color:#B91C1C">Locked</span></div>
<div class="card"><h3>📅 आरती एवं प्रसाद अर्पण अनुसूची</h3>
<table><thead><tr><th>दिनांक</th><th>प्रातःकाल (A,B,C,D)</th><th>सायंकाल (A,B,C,D)</th></tr></thead><tbody id=tb></tbody></table>
<div style="margin-top:12px"><button id=sv onclick=save() class=hidden>💾 Save Schedule</button></div></div>
<div class="card hidden" id=rp><h3>📊 Admin Report</h3><table><thead><tr><th>दिनांक</th><th>Morning</th><th>Evening</th></tr></thead><tbody id=rb></tbody></table></div>
</div>
<script>
const dates=["14.09.2026 (Monday)","15.09.2026","16.09.2026","17.09.2026","18.09.2026","19.09.2026","20.09.2026","21.09.2026","22.09.2026","23.09.2026","24.09.2026"];
let admin=false;const key="ganesh2026";let data=JSON.parse(localStorage.getItem(key)||"null")||dates.map((d,i)=>({d,m:["","","",""],e:["","","",""]}));
function cells(arr,p,dis){return `<div class=blk>${["A","B","C","D"].map((b,j)=>`<div><small>${b}</small><input ${dis?"disabled":""} value="${arr[j]||""}" onchange="u('${p}',${j},this.value)"></div>`).join("")}</div>`}
function draw(){tb.innerHTML="";rb.innerHTML="";data.forEach((r,i)=>{tb.innerHTML+=`<tr><td>${r.d}</td><td>${cells(r.m,`m${i}`,!admin)}</td><td>${cells(r.e,`e${i}`,!admin)}</td></tr>`;rb.innerHTML+=`<tr><td>${r.d}</td><td>${r.m.join(" | ")}</td><td>${r.e.join(" | ")}</td></tr>`});sv.className=admin?"":"hidden";rp.className=admin?"card":"card hidden";st.textContent=admin?"Admin Active":"Locked";st.style.color=admin?"green":"#B91C1C"}
function u(id,idx,v){const t=id[0],r=+id.slice(1);if(t=="m")data[r].m[idx]=v;else data[r].e[idx]=v}
function login(){if(p.value==="D404"){admin=true;draw();alert("Admin Login Successful")}else alert("Wrong Password")}
function save(){localStorage.setItem(key,JSON.stringify(data));alert("Schedule Saved")}
draw();
</script></body></html>
