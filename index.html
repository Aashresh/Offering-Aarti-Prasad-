
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avinash Atulya Ganesh Portal 2026</title>
<style>
body{font-family:Arial;margin:0;background:#FFF8EC}
header{background:linear-gradient(135deg,#D97706,#F59E0B,#FDE68A);color:#fff;text-align:center;padding:20px}
.logo{display:inline-block;background:#fff;color:#65A30D;padding:8px 18px;border-radius:10px;font-size:28px;font-weight:bold}
.logo small{display:block;color:#2563EB;font-size:12px}
.wrap{max-width:950px;margin:auto;padding:15px}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.row{display:flex;gap:8px;flex-wrap:wrap}
select,input{padding:8px;border:1px solid #ccc;border-radius:6px}
select{width:90px}
input{flex:1}
button{border:none;border-radius:6px;padding:8px 12px;color:#fff;cursor:pointer}
.save{background:#16A34A}.edit{background:#2563EB}.del{background:#DC2626}.report{background:#92400E}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{border:1px solid #ddd;padding:6px;text-align:center}
th{background:#F59E0B;color:#fff}
footer{text-align:center;padding:15px;color:#666}
</style>
</head>
<body>

<header>
<div class="logo"><small>अविनाश</small>अतुल्य</div>
<h2>🪔 श्री गणेश चतुर्थी उत्सव 2026</h2>
<h3>आरती एवं प्रसाद अर्पण कार्यक्रम</h3>
<p>14 सितम्बर 2026 (Monday) – 24 सितम्बर 2026 (Thursday)</p>
</header>

<div class="wrap">
<div style="text-align:right;margin-bottom:10px">
<button class="report" onclick="report()">📊 Admin Report</button>
</div>
<div id="app"></div>
</div>

<footer>Designed by D404</footer>

<script>
// ===== REPLACE WITH YOUR APPS SCRIPT URL =====
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyGcwRzXvdR0Qt4ffusnTEVp8U1CwnvGIIfOidq9ZmMpz6hS6W6LNXTLyhnTEMXtK0z/exec";
const PASSWORD="D404";

const dates=[
["14.09.2026","Monday",0,1],
["15.09.2026","Tuesday",1,1],
["16.09.2026","Wednesday",1,1],
["17.09.2026","Thursday",1,1],
["18.09.2026","Friday",1,1],
["19.09.2026","Saturday",1,1],
["20.09.2026","Sunday",1,1],
["21.09.2026","Monday",1,1],
["22.09.2026","Tuesday",1,1],
["23.09.2026","Wednesday",1,1],
["24.09.2026","Thursday",1,1]
];

let roster=[];

const sid=(d,s)=>(d+"_"+s).replace(/[^A-Za-z0-9]/g,"_");

async function load(){
try{
const r=await fetch(SCRIPT_URL);
roster=await r.json();
draw();
}catch(e){}
}

function list(date,session){
return roster.filter(x=>x.date===date && x.session===session);
}

function draw(){
let h="";
dates.forEach(d=>{
h+=`<div class="card">
<h3 style="color:#B45309">${d[0]} (${d[1]})</h3>`;

if(d[2]) h+=slot(d[0],"Morning","🌞");
h+=slot(d[0],"Evening","🌙");

if(d[0]=="24.09.2026")
h+=`<p style="color:#B91C1C;font-weight:bold">🌺 विसर्जन एवं महाआरती</p>`;

h+="</div>";
});
app.innerHTML=h;
}

function slot(date,session,icon){
const id=sid(date,session);
const rows=list(date,session);

let t=`<div style="margin-top:10px">
<b>${icon} ${session}</b>

<div class="row" style="margin-top:8px">
<select id="b${id}">
<option>A</option><option>B</option><option>C</option><option>D</option>
</select>

<input id="f${id}" placeholder="Flat Number">

async function save(date, session){

  const id = sid(date, session);

  const block = document.getElementById("b"+id).value;
  const flat  = document.getElementById("f"+id).value.trim();

  if(flat===""){
    alert("Please enter Flat Number");
    return;
  }

  await fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify({
      mode:"add",
      date:date,
      session:session,
      block:block,
      flat:flat
    })
  });

  // Clear only after successful save
  document.getElementById("f"+id).value = "";

  await load();
}
if(rows.length==0){
t+="<p style='color:#999'>No booking yet</p>";
}else{
t+="<table><tr><th>Block</th><th>Flat</th><th>Action</th></tr>";
rows.forEach(r=>{
t+=`<tr>
<td>${r.block}</td>
<td>${r.flat}</td>
<td>
<button class="edit" onclick="edit('${r.id}')">Edit</button>
<button class="del" onclick="del('${r.id}')">Delete</button>
</td>
</tr>`;
});
t+="</table>";
}

return t+"</div>";
}

async function save(date,session){
const id=sid(date,session);
const block=document.getElementById("b"+id).value;
const flat=document.getElementById("f"+id).value.trim();

if(flat==""){alert("Enter Flat Number");return;}

await fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify({
mode:"add",
date,session,block,flat
})
});

document.getElementById("f"+id).value="";
load();
}

async function edit(id){
if(prompt("Admin Password")!==PASSWORD) return;

const r=roster.find(x=>x.id===id);
const b=prompt("Block",r.block);
const f=prompt("Flat Number",r.flat);

if(b==null||f==null) return;

await fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify({
mode:"edit",
id,
block:b,
flat:f
})
});

load();
}

async function del(id){
if(prompt("Admin Password")!==PASSWORD) return;
if(!confirm("Delete booking?")) return;

await fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify({
mode:"delete",
id
})
});

load();
}

function report(){
if(prompt("Admin Password")!==PASSWORD) return;

let txt="GANESH BOOKING REPORT\n\n";

dates.forEach(d=>{
const m=list(d[0],"Morning").length;
const e=list(d[0],"Evening").length;
txt+=`${d[0]} : Morning ${m} | Evening ${e} | Total ${m+e}\n`;
});

alert(txt);
}

load();
setInterval(load,3000);
</script>

</body>
</html>
