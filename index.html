<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganesh Portal 2026</title>
<style>
body{font-family:Arial;background:#FFF8EC;margin:0}
header{background:linear-gradient(135deg,#D97706,#F59E0B,#FDE68A);padding:22px;color:#fff;text-align:center}
.logo{display:inline-block;background:#fff;padding:10px 20px;border-radius:12px;color:#65A30D;font-size:32px;font-weight:bold}
.logo small{display:block;color:#2563EB;font-size:12px}
.container{max-width:900px;margin:auto;padding:16px}
.day{background:#fff;padding:14px;border-radius:12px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.slot{margin-top:10px}
.row{display:flex;gap:8px;margin:6px 0}
select,input{padding:8px;border:1px solid #ccc;border-radius:6px}
select{width:80px}
input{flex:1}
button{background:#16A34A;color:#fff;border:none;border-radius:6px;padding:8px 12px;cursor:pointer}
.add{width:40px}
.lock{background:#374151}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:6px}
th{background:#F59E0B;color:#fff}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);justify-content:center;align-items:center}
.box{background:#fff;padding:20px;border-radius:10px;width:300px}
footer{text-align:center;padding:16px;color:#666}
</style>
</head>
<body>

<header>
<div class="logo"><small>अविनाश</small>अतुल्य</div>
<h2>🪔 श्री गणेश चतुर्थी उत्सव 2026</h2>
<h3>10 दिवसीय आरती एवं प्रसाद अर्पण कार्यक्रम</h3>
<p>14 सितम्बर 2026 (सायंकाल) – 24 सितम्बर 2026</p>
</header>

<div class="container">
<div style="text-align:right;margin-bottom:10px">
<button class="lock" onclick="showReport()">Admin Report</button>
</div>

<div id="schedule"></div>
</div>

<div id="admin" class="modal">
<div class="box">
<h3>🔒 Admin Password</h3>
<input id="pwd" type="password" placeholder="Enter Password">
<div style="margin-top:12px;text-align:right">
<button class="lock" onclick="closeAdmin()">Cancel</button>
<button onclick="verify()">Unlock</button>
</div>
</div>
</div>

<div id="report" class="modal">
<div class="box" style="width:90%;max-width:700px">
<div style="display:flex;justify-content:space-between">
<h3>Ganesh Report</h3>
<button class="lock" onclick="closeReport()">Close</button>
</div>
<div id="reportData"></div>
</div>
</div>

<footer>Designed by <b>D404</b></footer>

<script>
const PASSWORD="D404";
const KEY="GANESH2026";

const dates=[
["14.09.2026 (Monday)",false,true],
["15.09.2026",true,true],
["16.09.2026",true,true],
["17.09.2026",true,true],
["18.09.2026",true,true],
["19.09.2026",true,true],
["20.09.2026",true,true],
["21.09.2026",true,true],
["22.09.2026",true,true],
["23.09.2026",true,true],
["24.09.2026",true,true]
];

let admin=false;
let pending=null;

let data=JSON.parse(localStorage.getItem(KEY));

if(!data){
data=dates.map(d=>({
date:d[0],
morning:d[1]?[{block:"A",flat:""}]:null,
evening:[{block:"A",flat:""}]
}));
}

function save(){
localStorage.setItem(KEY,JSON.stringify(data));
}

function render(){

const wrap=document.getElementById("schedule");
wrap.innerHTML="";

data.forEach((d,i)=>{

let html=`<div class="day">
<h3 style="color:#B45309">${d.date}</h3>`;

if(d.morning){
html+=`<div class="slot"><b>🌞 Morning</b>`;
d.morning.forEach((r,x)=>{
html+=row(i,"morning",x,r);
});
html+=`</div>`;
}

html+=`<div class="slot"><b>🌙 Evening</b>`;
d.evening.forEach((r,x)=>{
html+=row(i,"evening",x,r);
});
if(i===10)
html+=`<p style="color:#B91C1C;font-weight:bold">🌺 विसर्जन एवं महाआरती</p>`;
html+=`</div></div>`;

wrap.innerHTML+=html;

});

buildReport();

}

function row(day,slot,index,r){

return `<div class="row">
<select onchange="edit(${day},'${slot}',${index},'block',this.value)">
<option ${r.block=="A"?"selected":""}>A</option>
<option ${r.block=="B"?"selected":""}>B</option>
<option ${r.block=="C"?"selected":""}>C</option>
<option ${r.block=="D"?"selected":""}>D</option>
</select>

<input value="${r.flat}" placeholder="Flat No."
oninput="edit(${day},'${slot}',${index},'flat',this.value)"
${admin?"":"readonly"}>

<button class="add" onclick="addRow(${day},'${slot}')">+</button>

</div>`;

}

function addRow(day,slot){

data[day][slot].push({block:"A",flat:""});
save();
render();

}

function edit(day,slot,index,field,val){

if(!admin){
pending={day,slot,index,field,val};
document.getElementById("admin").style.display="flex";
return;
}

data[day][slot][index][field]=val;
save();

}

function verify(){

if(document.getElementById("pwd").value!==PASSWORD){
alert("Wrong Password");
return;
}

admin=true;
document.getElementById("admin").style.display="none";

if(pending){
data[pending.day][pending.slot][pending.index][pending.field]=pending.val;
pending=null;
save();
render();
}

}

function closeAdmin(){
document.getElementById("admin").style.display="none";
}

function buildReport(){

let t=`<table>
<tr><th>Date</th><th>Morning</th><th>Evening</th></tr>`;

data.forEach(d=>{

const m=(d.morning||[]).map(x=>x.block+"-"+x.flat).join("<br>");
const e=d.evening.map(x=>x.block+"-"+x.flat).join("<br>");

t+=`<tr>
<td>${d.date}</td>
<td>${m}</td>
<td>${e}</td>
</tr>`;

});

t+="</table>";

document.getElementById("reportData").innerHTML=t;

}

function showReport(){

document.getElementById("admin").style.display="flex";

const old=verify;

verify=function(){

if(document.getElementById("pwd").value!==PASSWORD){
alert("Wrong Password");
return;
}

admin=true;
document.getElementById("admin").style.display="none";
document.getElementById("report").style.display="flex";
verify=old;

};

}

function closeReport(){
document.getElementById("report").style.display="none";
}

render();
</script>

</body>
</html>
