<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganesh Portal 2026</title>
<style>
body{font-family:Arial;margin:0;background:#FFF8EC}
header{background:linear-gradient(135deg,#D97706,#F59E0B,#FDE68A);color:#fff;padding:20px;text-align:center}
.logo{display:inline-block;background:#fff;color:#65A30D;padding:8px 18px;border-radius:10px;font-size:30px;font-weight:bold}
.logo small{display:block;color:#2563EB;font-size:12px}
.container{max-width:900px;margin:auto;padding:15px}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.row{display:flex;gap:8px;flex-wrap:wrap}
select,input{padding:8px;border:1px solid #ccc;border-radius:6px}
select{width:80px}
input{flex:1}
button{padding:8px 14px;border:none;border-radius:6px;color:#fff;cursor:pointer}
.save{background:#16A34A}
.edit{background:#2563EB}
.del{background:#DC2626}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:6px;text-align:center}
th{background:#F59E0B;color:#fff}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);justify-content:center;align-items:center}
.box{background:#fff;padding:20px;border-radius:10px;width:300px}
</style>
</head>
<body>

<header>
<div class="logo"><small>अविनाश</small>अतुल्य</div>
<h2>🪔 श्री गणेश चतुर्थी उत्सव 2026</h2>
<h3>आरती एवं प्रसाद अर्पण कार्यक्रम</h3>
<p>14 सितम्बर (सायंकाल) – 24 सितम्बर 2026</p>
</header>

<div class="container" id="app"></div>

<div id="admin" class="modal">
<div class="box">
<h3>Admin Password</h3>
<input type="password" id="pwd" placeholder="D404">
<div style="margin-top:10px;text-align:right">
<button onclick="closeAdmin()" style="background:#6B7280">Cancel</button>
<button onclick="verify()" class="save">Unlock</button>
</div>
</div>
</div>

<script>
const SCRIPT_URL="PASTE_YOUR_APPS_SCRIPT_URL_HERE";
const PASSWORD="D404";

const dates=[
["14.09.2026 (Monday)",false,true],
["15.09.2026",true,true],
["16.09.2026",true,true],
["17.09.2026",true,true],
["18.09.2026",true,true],
["19.09.2026",true,true],
["20.09.2026",true,true],
["21.09.2026",true,true],
["22.09.2026",true,true],
["23.09.2026",true,true],
["24.09.2026",true,true]
];

let editTarget=null;

async function loadRoster(){
  const res=await fetch(SCRIPT_URL);
  const rows=await res.json();
  render(rows);
}

function render(rows){
let html="";

dates.forEach(d=>{
const day=d[0];

html+=`<div class="card"><h3 style="color:#B45309">${day}</h3>`;

if(d[1]){
html+=slot(day,"Morning");
html+=roster(rows,day,"Morning");
}

html+=slot(day,"Evening");
html+=roster(rows,day,"Evening");

if(day.includes("24.09"))
html+=`<p style="color:#B91C1C;font-weight:bold">🌺 विसर्जन एवं महाआरती</p>`;

html+="</div>";
});

app.innerHTML=html;
}

function slot(date,session){
return `
<div style="margin-top:10px">
<b>${session=="Morning"?"🌞 Morning":"🌙 Evening"}</b>
<div class="row">
<select id="b${date}${session}">
<option>A</option><option>B</option><option>C</option><option>D</option>
</select>
<input id="f${date}${session}" placeholder="Flat No.">
<button class="save" onclick="saveEntry('${date}','${session}')">Save</button>
</div>
</div>`;
}

function roster(rows,date,session){

const list=rows.filter(r=>r[0]==date && r[1]==session);

let t=`<table>
<tr><th>Block</th><th>Flat</th><th>Action</th></tr>`;

if(list.length==0){
t+=`<tr><td colspan="3">Available</td></tr>`;
}else{

list.forEach((r,i)=>{
t+=`<tr>
<td>${r[2]}</td>
<td>${r[3]}</td>
<td>
<button class="edit" onclick="requestEdit('${date}','${session}','${r[2]}','${r[3]}')">Edit</button>
</td>
</tr>`;
});

}

t+="</table>";
return t;
}

async function saveEntry(date,session){

const block=document.getElementById("b"+date+session).value;
const flat=document.getElementById("f"+date+session).value;

if(flat==""){
alert("Enter Flat Number");
return;
}

await fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify({
date:date,
session:session,
block:block,
flat:flat,
mode:"add"
})
});

loadRoster();
}

function requestEdit(date,session,block,flat){
editTarget={date,session,block,flat};
admin.style.display="flex";
}

async function verify(){

if(pwd.value!==PASSWORD){
alert("Wrong Password");
return;
}

const newBlock=prompt("Block",editTarget.block);
const newFlat=prompt("Flat No.",editTarget.flat);

await fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify({
mode:"edit",
date:editTarget.date,
session:editTarget.session,
oldBlock:editTarget.block,
oldFlat:editTarget.flat,
block:newBlock,
flat:newFlat
})
});

closeAdmin();
loadRoster();
}

function closeAdmin(){
admin.style.display="none";
pwd.value="";
}

loadRoster();
setInterval(loadRoster,5000);
</script>

</body>
</html>
