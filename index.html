<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offering Aarti & Prasad</title>
<style>
body{font-family:Arial;background:#FFF8EC;margin:0}
header{background:linear-gradient(135deg,#D97706,#F59E0B,#FDE68A);color:#fff;text-align:center;padding:20px}
.logo{display:inline-block;background:#fff;padding:8px 20px;border-radius:12px;color:#65A30D;font-size:30px;font-weight:bold}
.logo small{display:block;color:#2563EB;font-size:12px}
.container{max-width:900px;margin:auto;padding:15px}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.booking{display:flex;gap:8px;margin-top:8px}
select,input{padding:8px;border:1px solid #ccc;border-radius:6px}
input{flex:1}
button{padding:8px 12px;border:none;border-radius:6px;color:#fff;cursor:pointer}
.save{background:#16A34A}
.edit{background:#2563EB}
.del{background:#DC2626}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:6px;text-align:center}
th{background:#F59E0B;color:#fff}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);justify-content:center;align-items:center}
.box{background:#fff;padding:20px;border-radius:10px;width:280px}
</style>
</head>
<body>

<header>
<div class="logo"><small>अविनाश</small>अतुल्य</div>
<h2>🪔 श्री गणेश चतुर्थी उत्सव 2026</h2>
<h3>आरती एवं प्रसाद अर्पण कार्यक्रम</h3>
<p>14 सितम्बर (सायंकाल) – 24 सितम्बर 2026</p>
</header>

<div class="container" id="app"></div>

<div id="admin" class="modal">
<div class="box">
<h3>🔒 Admin Verification</h3>
<input type="password" id="pwd" placeholder="Password">
<div style="margin-top:12px;text-align:right">
<button onclick="closeBox()" style="background:#6B7280">Cancel</button>
<button onclick="verify()" class="save">Unlock</button>
</div>
</div>
</div>

<script>
const PASS="D404";
const KEY="GANESH2026";

const dates=[
["14.09.2026 (Monday)",false,true],
["15.09.2026",true,true],
["16.09.2026",true,true],
["17.09.2026",true,true],
["18.09.2026",true,true],
["19.09.2026",true,true],
["20.09.2026",true,true],
["21.09.2026",true,true],
["22.09.2026",true,true],
["23.09.2026",true,true],
["24.09.2026",true,true]
];

let roster=JSON.parse(localStorage.getItem(KEY)||"null");
if(!roster){
roster=dates.map(d=>({date:d[0],morning:[],evening:[]}));
}

let action=null;

function saveData(){
localStorage.setItem(KEY,JSON.stringify(roster));
}

function render(){

let html="";

roster.forEach((d,i)=>{

html+=`<div class="card">
<h3 style="color:#B45309">${d.date}</h3>`;

if(i>0){

html+=`<b>🌞 Morning</b>
<div class="booking">
<select id="mb${i}">
<option>A</option><option>B</option><option>C</option><option>D</option>
</select>
<input id="mf${i}" placeholder="Flat No.">
<button class="save" onclick="add(${i},'morning')">Save</button>
</div>`;

html+=table(d.morning,i,"morning");

}

html+=`<br><b>🌙 Evening</b>
<div class="booking">
<select id="eb${i}">
<option>A</option><option>B</option><option>C</option><option>D</option>
</select>
<input id="ef${i}" placeholder="Flat No.">
<button class="save" onclick="add(${i},'evening')">Save</button>
</div>`;

html+=table(d.evening,i,"evening");

if(i==10)
html+=`<p style="color:#B91C1C;font-weight:bold">🌺 विसर्जन एवं महाआरती</p>`;

html+="</div>";

});

app.innerHTML=html;

}

function table(arr,day,slot){

let t=`<table>
<tr><th>Block</th><th>Flat</th><th>Action</th></tr>`;

if(arr.length==0){
t+=`<tr><td colspan="3">Available</td></tr>`;
}else{
arr.forEach((r,i)=>{
t+=`<tr>
<td>${r.block}</td>
<td>${r.flat}</td>
<td>
<button class="edit" onclick="requestEdit(${day},'${slot}',${i})">Edit</button>
<button class="del" onclick="requestDelete(${day},'${slot}',${i})">Del</button>
</td>
</tr>`;
});
}

t+="</table>";
return t;

}

function add(day,slot){

const block=document.getElementById((slot=="morning"?"mb":"eb")+day).value;
const flat=document.getElementById((slot=="morning"?"mf":"ef")+day).value;

if(flat==""){
alert("Enter Flat Number");
return;
}

roster[day][slot].push({block,flat});
saveData();
render();

}

function requestEdit(day,slot,index){
action={type:"edit",day,slot,index};
admin.style.display="flex";
}

function requestDelete(day,slot,index){
action={type:"delete",day,slot,index};
admin.style.display="flex";
}

function verify(){

if(pwd.value!=PASS){
alert("Wrong Password");
return;
}

if(action.type=="delete"){

roster[action.day][action.slot].splice(action.index,1);

}else{

const r=roster[action.day][action.slot][action.index];
const nb=prompt("Block",r.block);
const nf=prompt("Flat No",r.flat);

if(nb&&nf){
r.block=nb;
r.flat=nf;
}

}

saveData();
closeBox();
render();

}

function closeBox(){
admin.style.display="none";
pwd.value="";
}

render();
</script>

</body>
</html>
