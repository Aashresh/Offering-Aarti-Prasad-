<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganesh Portal</title>
<style>
body{font-family:Arial;background:#FFF8EC;margin:0}
header{background:#F59E0B;color:#fff;padding:20px;text-align:center}
.box{max-width:600px;margin:20px auto;background:#fff;padding:20px;border-radius:12px}
select,input,button{width:100%;padding:10px;margin:8px 0}
button{background:#16A34A;color:#fff;border:none;border-radius:8px}
</style>
</head>
<body>

<header>
<h2>🪔 श्री गणेश चतुर्थी उत्सव 2026</h2>
<h3>अविनाश अतुल्य सोसायटी</h3>
<p>आरती एवं प्रसाद अर्पण कार्यक्रम</p>
</header>

<div class="box">
<select id="date">
<option>14.09.2026 (Evening)</option>
<option>15.09.2026 Morning</option>
<option>15.09.2026 Evening</option>
<option>16.09.2026 Morning</option>
<option>16.09.2026 Evening</option>
</select>

<select id="block">
<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
</select>

<input id="flat" placeholder="Flat Number">

<button onclick="save()">Save</button>

<p id="msg"></p>
</div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyGcwRzXvdR0Qt4ffusnTEVp8U1CwnvGIlfOidq9ZmMpz6hS6W6LNXTLyhnTEMXtK0z/exec";

async function save(){
  const data={
    date:date.value,
    session:date.value.includes("Evening")?"Evening":"Morning",
    block:block.value,
    flat:flat.value,
    name:"Resident"
  };

  await fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify(data)
  });

  msg.innerHTML="✅ Saved Successfully";
  flat.value="";
}
</script>

</body>
</html>
