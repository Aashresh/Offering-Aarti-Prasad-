
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Avinash Atulya Ganesh Portal 2026</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#FFF8EC}
header{background:linear-gradient(135deg,#D97706,#F59E0B,#FDE68A);color:#fff;text-align:center;padding:22px}
.logo{display:inline-block;background:#fff;padding:8px 18px;border-radius:12px;color:#65A30D;font-size:30px;font-weight:bold}
.logo small{display:block;color:#2563EB;font-size:12px}
.container{max-width:950px;margin:auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.date{color:#B45309;font-size:18px;font-weight:bold}
.slot{margin-top:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
select,input{padding:10px;border:1px solid #D1D5DB;border-radius:8px}
select{width:85px}
input{flex:1}
button{border:none;border-radius:8px;padding:10px 14px;color:#fff;font-weight:bold;cursor:pointer}
.save{background:#16A34A}.edit{background:#2563EB}.del{background:#DC2626}.report{background:#92400E}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{border:1px solid #E5E7EB;padding:7px;text-align:center}
th{background:#F59E0B;color:#fff}
.empty{color:#9CA3AF;padding:8px 0}
footer{text-align:center;padding:18px;color:#666}
</style>
</head>
<body>

<header>
<div class="logo"><small>अविनाश</small>अतुल्य</div>
<h2>🪔 श्री गणेश चतुर्थी उत्सव 2026</h2>
<h3>आरती एवं प्रसाद अर्पण कार्यक्रम</h3>
<p>14 सितम्बर 2026 (Monday) – 24 सितम्बर 2026 (Thursday)</p>
</header>

<div class="container">
<div style="text-align:right;margin-bottom:12px">
<button class="report" onclick="adminReport()">📊 Admin Report</button>
</div>
<div id="app"></div>
</div>

<footer>Designed by <b>D404</b></footer>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyGcwRzXvdR0Qt4ffusnTEVp8U1CwnvGIIfOidq9ZmMpz6hS6W6LNXTLyhnTEMXtK0z/exec";
const ADMIN="D404";

const DAYS=[
["14.09.2026","Monday",false,true],
["15.09.2026","Tuesday",true,true],
["16.09.2026","Wednesday",true,true],
["17.09.2026","Thursday",true,true],
["18.09.2026","Friday",true,true],
["19.09.2026","Saturday",true,true],
["20.09.2026","Sunday",true,true],
["21.09.2026","Monday",true,true],
["22.09.2026","Tuesday",true,true],
["23.09.2026","Wednesday",true,true],
["24.09.2026","Thursday",true,true]
];

let roster=[], typing=false;
const sid=(d,s)=>(d+"_"+s).replace(/[^A-Za-z0-9]/g,"_");

async function loadRoster(){
 if(typing) return;
 try{
   const r=await fetch(SCRIPT_URL);
   roster=await r.json();
   draw();
 }catch(e){console.log(e);}
}

function list(date,session){
 return roster.filter(x=>x.date===date && x.session===session);
}

function draw(){
 let html="";
 DAYS.forEach(d=>{
   html+=`<div class="card">
   <div class="date">${d[0]} (${d[1]})</div>`;
   if(d[2]) html+=section(d[0],"Morning","🌞");
   html+=section(d[0],"Evening","🌙");
   if(d[0]=="24.09.2026")
      html+=`<p style="color:#B91C1C;font-weight:bold">🌺 विसर्जन एवं महाआरती</p>`;
   html+="</div>";
 });
 document.getElementById("app").innerHTML=html;
}

function section(date,session,icon){
 const id=sid(date,session);
 const rows=list(date,session);

 let h=`<div class="slot">
 <b>${icon} ${session}</b>

 <div class="row" style="margin-top:8px">
 <select id="b${id}">
 <option>A</option><option>B</option><option>C</option><option>D</option>
 </select>

 <input id="f${id}" placeholder="Flat Number" oninput="startTyping()">

 <button class="save" onclick="saveBooking('${date}','${session}')">Save</button>
 </div>`;

 if(rows.length==0){
   h+=`<div class="empty">No booking yet</div>`;
 }else{
   h+=`<table>
   <tr><th>Block</th><th>Flat</th><th>Action</th></tr>`;
   rows.forEach(r=>{
     h+=`<tr>
     <td>${r.block}</td>
     <td>${r.flat}</td>
     <td>
     <button class="edit" onclick="editBooking('${r.id}')">Edit</button>
     <button class="del" onclick="deleteBooking('${r.id}')">Delete</button>
     </td>
     </tr>`;
   });
   h+="</table>";
 }
 return h+"</div>";
}

function startTyping(){
 typing=true;
 clearTimeout(window.timer);
 window.timer=setTimeout(()=>typing=false,1500);
}

async function saveBooking(date,session){
 const id=sid(date,session);
 const block=document.getElementById("b"+id).value;
 const flat=document.getElementById("f"+id).value.trim();

 if(flat===""){ alert("Enter Flat Number"); return; }

 await fetch(SCRIPT_URL,{
   method:"POST",
   body:JSON.stringify({
     mode:"add",
     date,session,block,flat
   })
 });

 document.getElementById("f"+id).value="";
 typing=false;
 await loadRoster();
}

async function editBooking(id){
 if(prompt("Admin Password")!==ADMIN) return;

 const r=roster.find(x=>x.id===id);
 const block=prompt("Block",r.block);
 const flat=prompt("Flat Number",r.flat);

 if(block==null || flat==null) return;

 await fetch(SCRIPT_URL,{
   method:"POST",
   body:JSON.stringify({
     mode:"edit",
     id,
     block,
     flat
   })
 });

 await loadRoster();
}

async function deleteBooking(id){
 if(prompt("Admin Password")!==ADMIN) return;
 if(!confirm("Delete this booking?")) return;

 await fetch(SCRIPT_URL,{
   method:"POST",
   body:JSON.stringify({
     mode:"delete",
     id
   })
 });

 await loadRoster();
}

function adminReport(){
 if(prompt("Admin Password")!==ADMIN) return;

 let text="GANESH BOOKING REPORT\n\n";
 DAYS.forEach(d=>{
   const m=list(d[0],"Morning").length;
   const e=list(d[0],"Evening").length;
   text+=`${d[0]} : Morning ${m} | Evening ${e} | Total ${m+e}\n`;
 });
 alert(text);
}

loadRoster();
setInterval(()=>{ if(!typing) loadRoster(); },3000);
</script>

</body>
</html>
